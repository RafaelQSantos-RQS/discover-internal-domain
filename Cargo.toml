[package]
name = "dnsbrute"
version = "0.1.0"
edition = "2021"
description = "DNS brute-force enumeration tool for discovering internal assets"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
hickory-resolver = { version = "0.26", features = ["tokio", "system-config"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
rand = "0.9"
chrono = "0.4"